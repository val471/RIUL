
{% extends "base.html" %}

{% block titulo %}Contacto | RIUL{% endblock %}

{% block contenido %}
<section class="bienvenida">
    <h1>Contáctanos</h1>
    <p>¿Tienes preguntas o propuestas? Completa el formulario de contacto.</p>
</section>

<section class="seccion">
    <div class="panel-tarjeta" style="max-width:700px;margin:auto;">
        <h2>Envíanos un mensaje</h2>

        <form id="formContacto">
            <div class="auth-campo">
                <label for="nombreContacto">Nombre completo</label>
                <input type="text" id="nombreContacto" required>
            </div>

            <div class="auth-campo">
                <label for="correoContacto">Correo electrónico</label>
                <input type="email" id="correoContacto" required>
            </div>

            <div class="auth-campo">
                <label for="asuntoContacto">Asunto</label>
                <input type="text" id="asuntoContacto" required>
            </div>

            <div class="auth-campo">
                <label for="mensajeContacto">Mensaje</label>
                <textarea id="mensajeContacto" rows="5" required></textarea>
            </div>

            <button type="submit" class="boton boton-principal">Enviar mensaje</button>
            <p id="resultadoContacto" role="status" aria-live="polite"></p>
        </form>
    </div>
</section>


{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
