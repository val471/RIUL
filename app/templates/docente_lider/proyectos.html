<section class="proyectos-pagina" id="contenido-proyectos">

    <div class="proyectos-encabezado">
        <div>
            <span class="proyectos-etiqueta">GESTIÓN DE INVESTIGACIÓN</span>
            <h2>Proyectos</h2>
            <p>Gestiona proyectos y avances de tu semillero.</p>
        </div>

        <button type="button" class="btn-cargar-proyecto" id="btnCargarProyecto">
            + Cargar proyecto
        </button>
    </div>

    <form id="formProyecto" class="proyectos-formulario" hidden>

        <h3>Nuevo proyecto</h3>

        <div class="proyectos-campo">
            <label for="tituloProyecto">Título</label>
            <input id="tituloProyecto" type="text" maxlength="150"
                   placeholder="Nombre del proyecto" required>
        </div>

        <div class="proyectos-campo">
            <label for="descripcionProyecto">Descripción</label>
            <textarea id="descripcionProyecto" rows="3"
                      placeholder="¿De qué trata el proyecto?"></textarea>
        </div>

        <div class="proyectos-campo proyectos-campo-fecha">
            <label for="inicioProyecto">Fecha de inicio</label>
            <input id="inicioProyecto" type="date" required>
        </div>

        <div class="proyectos-form-acciones">
            <button type="submit" class="btn-cargar-proyecto" id="guardarProyecto">
                Guardar proyecto
            </button>
            <button type="button" class="btn-cancelar-proyecto" id="cancelarProyecto">
                Cancelar
            </button>
        </div>

        <p id="mensajeProyecto" class="proyectos-mensaje" hidden></p>
    </form>

    <div class="proyectos-resumen">
        <div class="proyectos-resumen-card">
            <span>Total de proyectos</span>
            <strong id="totalProyectos">0</strong>
        </div>
        <div class="proyectos-resumen-card">
            <span>Proyectos activos</span>
            <strong id="proyectosActivos">0</strong>
        </div>
        <div class="proyectos-resumen-card">
            <span>En revisión</span>
            <strong id="proyectosRevision">0</strong>
        </div>
    </div>

    <div class="proyectos-contenido">
        <div class="proyectos-tabla-contenedor">
            <table class="proyectos-tabla">
                <thead>
                    <tr>
                        <th>Proyecto</th>
                        <th>Inicio</th>
                        <th>Avances registrados</th>
                        <th>Estado</th>
                    </tr> 
                </thead> 
                <tbody id="tablaProyectos">
                    <tr>
                        <td colspan="4" class="proyectos-vacio">
                            Todavía no has cargado proyectos.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
