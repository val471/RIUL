
<section class="publicaciones-pagina" id="contenido-publicaciones">

    <!-- ENCABEZADO -->
    <div class="publicaciones-encabezado">
        <div>
            <span class="publicaciones-etiqueta">MI EXPERIENCIA RIUL</span>
            <h2>Publicaciones</h2>
            <p>Comparte avances, archivos y contenido académico.</p>
        </div>

        <button type="button" id="btnAbrirPublicar" class="publicaciones-btn-nuevo">
            + Publicar
        </button>
    </div>

    <!-- FORMULARIO (oculto hasta pulsar Publicar) -->
    <div class="publicaciones-formulario" id="cajaFormulario" hidden>
        <h3>Nueva publicación</h3>

        <form id="formPublicacion">

            <textarea
                id="contenidoPublicacion"
                placeholder="Comparte tus avances o contenido académico..."
                required
            ></textarea>

            <div class="publicaciones-opciones">
                <label class="publicaciones-adjunto">
                    <span>Adjuntar archivo (opcional)</span>
                    <input type="file" id="archivoPublicacion" accept="image/*,.pdf">
                </label>

                <label class="publicaciones-academica">
                    <input type="checkbox" id="publicacionAcademica">
                    Publicación académica
                </label>

                <button type="submit" id="btnPublicar">Publicar contenido</button>
            </div>

            <p id="nombreArchivoPublicacion"></p> 
        </form>
    </div>

    <!-- RESUMEN -->
    <div class="publicaciones-resumen">
        <div class="publicaciones-resumen-card">
            <span>Total de publicaciones</span>
            <strong id="totalPublicaciones">0</strong>
        </div>

        <div class="publicaciones-resumen-card">
            <span>Publicaciones académicas</span>
            <strong id="totalAcademicas">0</strong>
        </div>
    </div>

    <!-- BUSCADOR -->
    <div class="publicaciones-buscador">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>
        </svg>
        <input type="text" id="buscarPublicacion" placeholder="Buscar publicaciones...">
    </div>

    <!-- LISTA -->
    <div id="listaPublicaciones">
        <div class="publicaciones-vacio">Todavía no hay publicaciones disponibles.</div>
    </div>

</section>
