
<section id="contenido-eventos">

    <div class="cab">
        <div>
            <span class="etiqueta">MI EXPERIENCIA RIUL</span>
            <h2>Eventos</h2>
            <p>Registra la participación de tu semillero.</p>
        </div>
    </div>

    <div class="eventos-filtros">
        <label class="eventos-buscador">
            <span data-icon="search"></span>
            <input type="text" id="buscarEvento" placeholder="Buscar por nombre...">
        </label>

        <select id="filtroEvento">
            <option value="todos">Todos</option>
            <option value="abierto">Abiertos</option>
            <option value="cerrado">Cerrados</option>
        </select>
    </div>

    <div class="eventos-lista" id="listaEventos">

        <article class="evento-card">
            <div class="evento-icono">
                <span data-icon="cal"></span>
            </div>

            <div class="evento-info">
                <h3>Feria Nacional de Semilleros</h3>
                <p>Cierre: 18 oct 2025 · Modalidad: Semillero</p>
            </div>

            <div class="evento-acciones">
                <span class="evento-estado abierto">Abierta</span>
                <button type="button" class="boton boton-principal">
                    Inscribirme
                </button>
            </div>
        </article>

    </div>

</section>
