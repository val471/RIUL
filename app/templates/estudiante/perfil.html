
<section class="page" id="page-perfil">

    <div class="perfil-container">

        <div class="perfil-header">
            <h2>Mi perfil</h2>
            <p>Consulta y administra tu información personal.</p>
        </div>

        <div class="perfil-card">

            <div class="perfil-foto">
                <img src="/static/img/avatar.png"
                     alt="Foto de perfil"
                     id="fotoPerfil">

                <label for="cambiarFoto">Cambiar foto</label>
                <input type="file" id="cambiarFoto"
                       accept="image/*" hidden>
            </div>

            <div class="perfil-datos">

                <div class="campo">
                    <label>Nombre completo</label>
                    <input type="text" id="nombre"
                           placeholder="Nombre del estudiante" readonly>
                </div>

                <div class="campo">
                    <label>Correo institucional</label>
                    <input type="email" id="correo"
                           placeholder="Correo institucional" readonly>
                </div>

                <div class="campo">
                    <label>Programa académico</label>
                    <input type="text" id="programa"
                           placeholder="Programa académico" readonly>
                </div>

                <div class="campo">
                    <label>Semestre</label>
                    <input type="text" id="semestre"
                           placeholder="Semestre" readonly>
                </div>

                <div class="campo">
                    <label>Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento">
                </div>

                <div class="campo">
                    <label>Nueva contraseña</label>
                    <input type="password" id="nuevaContrasena"
                           placeholder="Ingresa una nueva contraseña">
                </div>

                <div class="campo">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="confirmarContrasena"
                           placeholder="Confirma tu contraseña">
                </div>

            </div>

            <div class="perfil-acciones">
                <button type="button" id="solicitarCambio">
                    Solicitar cambio académico
                </button>

                <button type="button" id="guardarPerfil">
                    Guardar cambios
                </button>
            </div>

        </div>
    </div>

</section>
