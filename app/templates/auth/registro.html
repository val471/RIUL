
{% extends "base.html" %}

{% block title %}Crear cuenta | RIUL{% endblock %}

{% block content %}
<section class="auth-pagina">
    <div class="auth-tarjeta auth-tarjeta-registro">
        <a href="{{ url_for('web.inicio') }}" class="auth-logo">RIUL</a>

        <span class="etiqueta-seccion">ÚNETE A NUESTRA COMUNIDAD</span>
        <h1>Crea tu cuenta</h1>
        <p class="auth-descripcion">
            Forma parte de la Red de Investigación Universidad Libre.
        </p>

        <form id="formRegistro">
            <div class="auth-campo">
                <label for="nombreRegistro">Nombre completo</label>
                <input
                    type="text"
                    id="nombreRegistro"
                    name="nombre"
                    placeholder="Escribe tu nombre completo"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="auth-campo">
                <label for="correoRegistro">Correo institucional</label>
                <input
                    type="email"
                    id="correoRegistro"
                    name="correo"
                    placeholder="nombre@unilibre.edu.co"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-campo">
                <label for="rolRegistro">Tipo de usuario</label>
                <select id="rolRegistro" name="rol" required>
                    <option value="">Selecciona tu rol</option>
                    <option value="ESTUDIANTE">Estudiante</option>
                    <option value="DOCENTE">Docente</option>
                </select>
            </div>

            <div class="auth-campo">
                <label for="contrasenaRegistro">Contraseña</label>
                <input
                    type="password"
                    id="contrasenaRegistro"
                    name="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="auth-campo">
                <label for="confirmarContrasena">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmarContrasena"
                    name="confirmar_contrasena"
                    placeholder="Repite tu contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="auth-boton">
                Crear cuenta
            </button>

            <p id="mensajeRegistro" class="auth-mensaje" role="status"></p>
        </form>

        <div class="auth-separador"></div>

        <p class="auth-pie">
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('web.iniciar_sesion') }}">Inicia sesión</a>
        </p>

        <a href="{{ url_for('web.inicio') }}" class="auth-volver">
            ← Volver al inicio
        </a>
    </div>
</section>

<script>
document.getElementById("formRegistro").addEventListener("submit", function(event) {
    event.preventDefault();

    const contrasena = document.getElementById("contrasenaRegistro").value;
    const confirmar = document.getElementById("confirmarContrasena");
    const mensaje = document.getElementById("mensajeRegistro");

    if (contrasena !== confirmar.value) {
        confirmar.setCustomValidity("Las contraseñas no coinciden.");
        confirmar.reportValidity();
        confirmar.setCustomValidity("");
        return;
    }

    mensaje.textContent =
        "El formulario está listo. El registro se habilitará al conectar la base de datos.";
});
</script>
{% endblock %}
