<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | RIUL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-pagina">
        <section class="auth-lateral">
            <a href="{{ url_for('web.inicio') }}" class="logo" style="color:white;">RIUL</a>
            <h1>Únete a la comunidad investigativa</h1>
            <p>
                Regístrate para explorar semilleros, conocer proyectos
                y participar en actividades académicas.
            </p>
            <img
                src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=900&q=80"
                alt="Estudiantes universitarios">
        </section>

        <section class="auth-contenedor">
            <form class="auth-tarjeta" id="formRegistro">
                <h2>Crear cuenta</h2>
                <p>Completa tus datos institucionales.</p>

                <div class="auth-campo">
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>

                <div class="auth-campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>

                <div class="auth-campo">
                    <label for="documento">Documento de identidad</label>
                    <input type="text" id="documento" name="documento" required>
                </div>

                <div class="auth-campo">
                    <label for="correoRegistro">Correo institucional</label>
                    <input type="email" id="correoRegistro" name="correo"
                           placeholder="usuario@unilibre.edu.co" required>
                </div>

                <div class="auth-campo">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona tu rol</option>
                        <option value="ESTUDIANTE">Estudiante</option>
                        <option value="DOCENTE">Docente</option>
                    </select>
                </div>

                <div class="auth-campo">
                    <label for="facultad">Facultad</label>
                    <select id="facultad" name="facultad" required>
                        <option value="">Selecciona tu facultad</option>
                        <option value="Ingeniería">Ingeniería</option>
                        <option value="Ciencias Económicas">Ciencias Económicas</option>
                        <option value="Derecho">Derecho</option>
                        <option value="Ciencias de la Salud">Ciencias de la Salud</option>
                        <option value="Otra">Otra</option>
                    </select>
                </div>

                <div class="auth-campo">
                    <label for="claveRegistro">Contraseña</label>
                    <input type="password" id="claveRegistro" name="contrasena"
                           minlength="8" required>
                </div>

                <div class="auth-campo">
                    <label for="confirmarClave">Confirmar contraseña</label>
                    <input type="password" id="confirmarClave"
                           name="confirmar_contrasena" minlength="8" required>
                </div>

                <p id="mensajeRegistro" role="status"></p>

                <button class="auth-boton" type="submit">Crear cuenta</button>

                <p>¿Ya tienes cuenta?
                    <a href="{{ url_for('web.iniciar_sesion') }}">Inicia sesión</a>
                </p>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
