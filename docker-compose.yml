services:
  # Aplicación Flask
  app:
    build: .
    # Nombre del contenedor
    container_name: RIUL

    # localhost:5000 -> contenedor:5000
    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: mysql+pymysql://riul_app:RIUL_AAA@db:3306/riul_db
      JWT_SECRET_KEY: suero-AAA

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  # Base de datos MySQL
  db:
    image: mysql:8.4
    container_name: RIUL_mysql

    environment:
      MYSQL_DATABASE: riul_db
      MYSQL_USER: riul_app
      MYSQL_PASSWORD: RIUL_AAA
      MYSQL_ROOT_PASSWORD: RIULRoot_AAA

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRIULRoot_AAA"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:


